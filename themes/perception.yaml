# Perception — a black-and-gold "liquid glass" theme for Home Assistant.
#
# Requires the card-mod frontend plugin (install via HACS). The card-mod-card
# block below applies the frosted-glass effect to EVERY card automatically,
# so your dashboard YAML can stay clean.
#
# Install: drop this file in <config>/themes/, ensure configuration.yaml has
#   frontend:
#     themes: !include_dir_merge_named themes
# then restart HA and pick "Perception" (Profile → Theme, or per-view `theme:`).

Perception:
  # ------------------------------------------------------------------ palette
  # Warm black background with a single gold accent, used consistently for
  # every interactive/active state (primary-color, switches, sliders, focus
  # rings, selected sidebar item, checked checkboxes, ...). Text stays a warm
  # ivory-white for legibility rather than gold-on-gold.
  primary-color: "#d4af37"            # classic "gold" — primary accent
  accent-color: "#f5cf6b"             # brighter gold — hover/accent highlights
  primary-text-color: "rgba(250, 245, 235, 0.92)"
  secondary-text-color: "rgba(228, 210, 170, 0.58)"
  disabled-text-color: "rgba(228, 210, 170, 0.30)"
  text-primary-color: "rgba(250, 245, 235, 0.92)"
  divider-color: "rgba(212, 175, 55, 0.16)"

  # -------------------------------------------------------------- backgrounds
  # A warm near-black gradient (bronze glow, not neutral grey) gives the gold
  # glass something to blur against. Swap the gradient for
  # `url('/local/wallpaper.jpg') center/cover fixed` to blur a real photo instead.
  lovelace-background: "radial-gradient(1200px circle at 18% 12%, #2a2110 0%, #140f08 55%, #030201 100%) fixed"
  primary-background-color: "#0a0805"
  secondary-background-color: "#141008"
  card-background-color: "rgba(212, 175, 55, 0.18)"
  ha-card-background: "rgba(212, 175, 55, 0.18)"

  # Surface hierarchy (HA 2026.5+). These are the fallback surfaces used by
  # everything card-mod-card doesn't reach — dialogs, menus, popups, tooltips.
  # HA's defaults resolve LIGHT, so without these, non-card surfaces read as
  # white boxes against our dark theme (this is what caused the white-on-white
  # tooltip). Pinning them dark keeps the whole UI cohesive. Harmless on older
  # HA (the tokens are simply ignored).
  ha-color-surface-default: "#171209"
  ha-color-surface-low: "#1d1710"
  ha-color-surface-lower: "#0a0703"
  ha-color-on-surface-default: "rgba(250, 245, 235, 0.92)"

  # Forms (ha-input/wa-input, ha-textarea, ha-checkbox, ha-picker-field, ...).
  # HA 2026.x rebuilt its form controls on a new semantic "--ha-color-*" token
  # system (src/resources/theme/color/semantic.globals.ts) that is completely
  # separate from the classic primary-text-color/card-background-color tokens
  # above. HA only swaps in its own dark variant of these tokens when it
  # detects a "dark" theme; a flat custom theme like this one (no `modes:`
  # block) doesn't trip that detection, so every form control's *background*
  # silently stayed on HA's light default (near-white) while the typed-in
  # *text* still inherited our near-white --primary-text-color normally (color
  # is an inherited CSS property, unlike background-color) → invisible
  # white-on-white text in every text field, textarea, checkbox and picker.
  # Overriding the tokens directly here — regardless of light/dark detection —
  # is the actual fix (a previous attempt at forcing this via `::part(input)`
  # didn't work because ha-input re-exports that part under a different name).
  ha-color-text-primary: "rgba(250, 245, 235, 0.92)"
  ha-color-text-secondary: "rgba(228, 210, 170, 0.58)"
  ha-color-text-disabled: "rgba(228, 210, 170, 0.30)"
  ha-color-border-neutral-quiet: "rgba(212, 175, 55, 0.16)"
  ha-color-border-neutral-normal: "rgba(212, 175, 55, 0.34)"
  ha-color-border-neutral-loud: "rgba(212, 175, 55, 0.60)"
  ha-color-form-background: "rgba(212, 175, 55, 0.10)"
  ha-color-form-background-hover: "rgba(212, 175, 55, 0.16)"
  ha-color-form-background-disabled: "rgba(120, 100, 60, 0.06)"
  # Placeholder text color in ha-input reads this core scale token directly
  # (not one of the semantic aliases above).
  ha-color-neutral-60: "rgba(228, 210, 170, 0.45)"
  # Focus ring, links, and the checked-checkbox fill all read these directly —
  # tie them to the gold accent so keyboard focus/links/checked states read
  # as part of the same gold language as switches/sliders/sidebar selection.
  ha-color-focus: "#d4af37"
  ha-color-text-link: "#f5cf6b"
  ha-color-fill-primary-loud-resting: "#d4af37"
  ha-color-fill-primary-loud-hover: "#f5cf6b"

  # Left sidebar: keep it mostly opaque so it doesn't read as see-through
  # against the gradient (was falling back to a translucent surface).
  sidebar-background-color: "rgba(10, 8, 5, 0.90)"
  sidebar-text-color: "rgba(250, 245, 235, 0.82)"
  sidebar-icon-color: "rgba(228, 210, 170, 0.55)"
  # Selected item: a translucent gold pill with brighter text/icon, so the
  # active page reads as part of the glass rather than a flat highlight.
  sidebar-selected-background-color: "rgba(212, 175, 55, 0.22)"
  sidebar-selected-text-color: "rgba(255, 250, 235, 0.98)"
  sidebar-selected-icon-color: "#f5cf6b"

  # Darken the backdrop behind more-info dialogs so the wallpaper/gradient
  # showing through isn't distracting when a dialog opens.
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.78)"
  # Glass dialogs (HA 2026.5+): frost the dialog panel and blur the scrim so
  # more-info / settings popups match the cards instead of being a flat sheet.
  ha-dialog-border-radius: "24px"
  ha-dialog-surface-backdrop-filter: "blur(30px) saturate(180%)"
  ha-dialog-scrim-backdrop-filter: "blur(6px)"

  # ------------------------------------------------------------------- header
  app-header-background-color: "transparent"
  app-header-text-color: "rgba(250, 245, 235, 0.92)"
  app-header-selection-bar-color: "#d4af37"

  # ------------------------------------------------------------------ tooltips
  # ha-tooltip's background falls back to --ha-color-surface-default (a light
  # surface) while its text falls back to --primary-text-color (near-white in
  # this theme) → white-on-white, invisible in the top nav. Style it as frosted
  # glass to match the cards: translucent dark fill, hairline border, rounded
  # corners, soft drop shadow. (The blur itself is applied via card-mod-root-yaml
  # below, since there's no theme token for backdrop-filter.)
  ha-tooltip-background-color: "rgba(20, 16, 8, 0.70)"
  ha-tooltip-text-color: "rgba(250, 245, 235, 0.92)"
  ha-tooltip-border-radius: "14px"
  ha-tooltip-padding: "8px 12px"
  ha-tooltip-box-shadow: "0 8px 24px rgba(0, 0, 0, 0.45)"

  # -------------------------------------------------------------- card shape
  ha-card-border-radius: "24px"
  ha-card-border-color: "rgba(212, 175, 55, 0.45)"
  ha-card-border-width: "1.5px"
  ha-card-box-shadow: "0 12px 40px rgba(0, 0, 0, 0.55)"

  # ------------------------------------------------- controls / icons / state
  # Default icons/dividers stay a warm off-white; only ACTIVE/checked/selected
  # elements go gold, so gold reads as "this is on / selected" rather than
  # decorating everything.
  paper-item-icon-color: "rgba(250, 245, 235, 0.72)"
  state-icon-color: "rgba(228, 210, 170, 0.75)"
  state-icon-active-color: "#d4af37"
  switch-checked-color: "#d4af37"
  switch-unchecked-color: "rgba(228, 210, 170, 0.30)"
  slider-color: "#d4af37"
  slider-track-color: "rgba(228, 210, 170, 0.30)"
  # Tile / feature controls
  feature-button-background-color: "rgba(212, 175, 55, 0.22)"

  # -------------------------------------------------------------- typography
  # Inter — the dominant modern UI/dashboard typeface in 2026 (neutral, tall
  # x-height, tabular figures). Loaded as a web font in the card-mod-root-yaml
  # block below, then applied to every text surface here.
  primary-font-family: "Inter, 'Helvetica Neue', Arial, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-common-code_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-caption_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  ha-card-header-font-family: "var(--primary-font-family)"
  mdc-typography-font-family: "var(--primary-font-family)"

  # --------------------------------------------------- the glass (card-mod)
  # This name MUST match the theme name above for card-mod to activate it.
  card-mod-theme: Perception
  # Self-hosted Inter (variable) web font, injected at the app root so it's
  # available inside every shadow DOM — no CDN, works fully offline. The font
  # file must live at config/www/perception/InterVariable.woff2 (HA serves the
  # www/ folder at /local/). See the README for how to install it.
  card-mod-root-yaml: |
    .: |
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/local/perception/InterVariable.woff2") format("woff2");
      }
      html {
        --primary-font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        --mdc-typography-font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        --paper-font-common-base_-_font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        --paper-font-body1_-_font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      }
      /* Frost the tooltip body to match the cards. The translucent dark fill,
         border and shadow come from the ha-tooltip-* theme tokens; the blur +
         hairline edge (which have no theme token) are added here. */
      ha-tooltip::part(body) {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(212, 175, 55, 0.45);
      }
      /* --- Fix invisible (white-on-white) text in pickers & edit fields ----
         HA's search/combo-box dropdowns (icon picker, entity picker, area
         picker, etc.) render each row as a Material Design 3 list item
         (<ha-combo-box-item>/<ha-md-list-item>, slot="headline") inside an
         overlay, and plain text inputs as <ha-textfield>. These components
         default their own container/surface color to Material's light
         baseline, while this theme forces near-white text everywhere — so
         without overriding the container color too, the text is invisible:
         white on white. Cover MD3, legacy mwc/paper, and Vaadin (combo-box
         overlay) tokens since HA mixes all three across pickers. */
      ha-combo-box-item,
      ha-md-list-item,
      md-list-item,
      ha-list-item,
      mwc-list-item {
        --md-list-item-container-color: rgba(23, 18, 9, 0.98);
        --md-list-item-label-text-color: rgba(250, 245, 235, 0.92);
        --md-list-item-supporting-text-color: rgba(228, 210, 170, 0.60);
        --md-list-item-leading-icon-color: rgba(228, 210, 170, 0.72);
        --md-list-item-trailing-icon-color: rgba(228, 210, 170, 0.72);
        --md-list-item-selected-container-color: rgba(212, 175, 55, 0.20);
        --mdc-theme-text-primary-on-background: rgba(250, 245, 235, 0.92);
        --mdc-theme-text-secondary-on-background: rgba(228, 210, 170, 0.60);
      }
      vaadin-combo-box-overlay,
      md-menu,
      mwc-menu-surface,
      ha-menu {
        --md-menu-container-color: rgba(20, 16, 8, 0.98);
        --mdc-menu-surface-fill-color: rgba(20, 16, 8, 0.98);
        --lumo-base-color: rgba(20, 16, 8, 0.98);
        --lumo-body-text-color: rgba(250, 245, 235, 0.92);
        --lumo-contrast-10pct: rgba(212, 175, 55, 0.10);
        --lumo-contrast-60pct: rgba(228, 210, 170, 0.55);
      }
      vaadin-combo-box-overlay::part(overlay) {
        background: rgba(20, 16, 8, 0.98);
      }
      vaadin-combo-box-overlay::part(content),
      vaadin-item::part(content) {
        color: rgba(250, 245, 235, 0.92);
      }
      /* Legacy text fields (HA < 2026, still mwc/paper-based per this repo's
         2024.8.0 hacs.json minimum). Harmless no-ops on newer HA, which
         replaced these with ha-input/wa-input (fixed via the ha-color-*
         tokens above) — see themes/perception.yaml's "Forms" section. */
      ha-textfield,
      mwc-textfield,
      paper-input {
        --mdc-text-field-fill-color: rgba(212, 175, 55, 0.08);
        --mdc-text-field-ink-color: rgba(250, 245, 235, 0.92);
        --mdc-text-field-label-ink-color: rgba(228, 210, 170, 0.58);
        --mdc-text-field-idle-line-color: rgba(212, 175, 55, 0.30);
        --mdc-text-field-hover-line-color: rgba(212, 175, 55, 0.55);
        --paper-input-container-color: rgba(228, 210, 170, 0.58);
        --paper-input-container-focus-color: #d4af37;
        --paper-input-container-input-color: rgba(250, 245, 235, 0.92);
      }
      /* Belt-and-suspenders for ha-input/ha-textarea (HA 2026.x): these wrap
         Web Awesome's <wa-input>/<wa-textarea>, which re-export their inner
         native <input>/<textarea> up through TWO shadow boundaries under
         different part names at each hop (confirmed via
         home-assistant/frontend src/components/input/ha-input.ts:
         exportparts="base:wa-base, hint:wa-hint, input:wa-input"). Forcing
         the fill/text color directly here means the fix holds even if a
         future HA release changes what the ha-color-form-background token
         resolves to. (A generic `*::part(input)` does NOT reach this — the
         part is renamed to "wa-input" at the ha-input boundary, which is why
         that approach silently failed before.) */
      ha-input::part(wa-input),
      ha-textarea::part(wa-textarea) {
        color: rgba(250, 245, 235, 0.92) !important;
        background-color: rgba(212, 175, 55, 0.10) !important;
        caret-color: #d4af37 !important;
      }
      ha-input::part(wa-input)::placeholder,
      ha-textarea::part(wa-textarea)::placeholder {
        color: rgba(228, 210, 170, 0.45) !important;
      }
      /* --- Accessibility & performance fallbacks ---------------------------
         On devices that can't (or shouldn't) render blur, glass turns into a
         translucent fog with poor contrast. Degrade to solid dark surfaces so
         the theme stays legible on low-power wall tablets and honours the OS
         "reduce transparency" setting. */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        ha-card {
          background: #1a140a !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
        ha-tooltip::part(body) { backdrop-filter: none; }
      }
      @media (prefers-reduced-transparency: reduce) {
        ha-card {
          background: #1a140a !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          border-color: rgba(212, 175, 55, 0.35) !important;
        }
        ha-tooltip::part(body) {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
  card-mod-card: |
    ha-card {
      /* "Liquid gold glass": a warm gold specular sheen top-left fading into
         a darker bronze base bottom-right, with a bright gold hairline edge
         and a gold glint along the top lip — reads as a pane of gold-tinted
         glass rather than a flat gold fill. */
      background:
        linear-gradient(135deg,
          rgba(255, 215, 130, 0.36) 0%,
          rgba(120, 90, 30, 0.20) 100%) !important;
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1.5px solid rgba(212, 175, 55, 0.46) !important;
      border-radius: 24px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.55),             /* deep drop → panel floats */
        inset 0 1.5px 0 rgba(255, 230, 160, 0.55),   /* bright gold top lip glint */
        inset 0 -1px 1px rgba(40, 25, 5, 0.35),      /* warm shaded bottom edge */
        inset 0 0 0 1px rgba(212, 175, 55, 0.12);    /* faint gold inner ring */
    }
